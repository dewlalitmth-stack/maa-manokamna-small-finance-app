name: Build Maa Manokamna Small Finance APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project ZIP
        run: |
          if [ ! -f MaaManokamnaSmallFinanceAndroidProject.zip ]; then
            echo "ERROR: Android project ZIP nahi mili."
            exit 1
          fi

          mkdir -p android-project
          unzip -o MaaManokamnaSmallFinanceAndroidProject.zip \
            -d android-project

          if [ ! -f android-project/settings.gradle ]; then
            echo "ERROR: ZIP ke andar settings.gradle nahi mili."
            find android-project -maxdepth 3 -type f
            exit 1
          fi

      - name: Build APK
        run: |
          cd android-project
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Maa-Manokamna-Small-Finance-APK
          path: android-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
