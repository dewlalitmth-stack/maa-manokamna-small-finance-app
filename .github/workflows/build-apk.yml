name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Maa Manokamna Small Finance APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Check Android project files
        run: |
          echo "Repository files:"
          ls -la
          echo "Gradle project files:"
          find . -maxdepth 4 \
            \( -name 'settings.gradle' \
            -o -name 'settings.gradle.kts' \
            -o -name 'build.gradle' \
            -o -name 'build.gradle.kts' \
            -o -name 'AndroidManifest.xml' \) -print

      - name: Build Debug APK
        run: |
          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            echo "ERROR: Root settings.gradle file nahi mili."
            echo "Android project ki files repository mein sahi jagah upload karein."
            exit 1
          fi

          if [ ! -d app ]; then
            echo "ERROR: app folder repository ke root mein nahi mila."
            exit 1
          fi

          gradle --no-daemon assembleDebug

      - name: Show generated APK
        if: success()
        run: |
          find . -type f -name '*.apk' -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Maa-Manokamna-Small-Finance-APK
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error
          retention-days: 7
